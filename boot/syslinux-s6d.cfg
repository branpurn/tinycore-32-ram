# tc755-s6d: separate S6d-export floppy (not the recovery tc32/tc755 image).
# COM1 9600 8N1 boot prompt + kernel console + getty. noswap: no fdisk/swapon
# in core-s6d. CF boot is not used on this path.
SERIAL 0 9600
DEFAULT s6d
PROMPT 1
TIMEOUT 30
SAY tc755-s6d: S6d-export kernel + slim core. Boots in 3 s. COM1 9600. [Enter]=s6d
LABEL s6d
  KERNEL vmlinuz
  APPEND initrd=core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 console=ttyS0,9600n8 noswap
LABEL vga
  KERNEL vmlinuz
  APPEND initrd=core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 quiet noswap
LABEL generic
  KERNEL vmlinuz
  APPEND initrd=core.xz console=tty0 console=ttyS0,9600n8 noswap
