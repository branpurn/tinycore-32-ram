# tc32 installer floppy (syslinux 4.07). Same kernel and core.xz as the
# rescue floppy plus install.xz (install-to-disk, extlinux, mbr.bin) as a
# second initramfs. Same console defaults: boot: prompt on COM1 9600 8N1,
# kernel console on VGA + COM1, auto-boot after 3 s.
# noswap: do not enable swap on the disk that is about to be overwritten.
# atkbd.xlate=2: decode the 755C keyboard (raw i8042 port that still sends
# set-1 codes) as translated; see boot/syslinux.cfg.
SERIAL 0 9600
DEFAULT install
PROMPT 1
TIMEOUT 30
SAY tc32 installer: boots in 3 s.  [Enter]=installer (VGA+COM1 9600)   generic=installer, non-ThinkPad   rescue=plain tc32
LABEL install
  KERNEL vmlinuz
  APPEND initrd=core.xz,install.xz floppy=thinkpad atkbd.xlate=2 console=tty0 console=ttyS0,9600n8 noswap
LABEL generic
  KERNEL vmlinuz
  APPEND initrd=core.xz,install.xz console=tty0 console=ttyS0,9600n8 noswap
LABEL rescue
  KERNEL vmlinuz
  APPEND initrd=core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 console=ttyS0,9600n8
