# tc32 boot menu (syslinux 4.07).
# SERIAL: the boot: prompt is mirrored on COM1 (9600 8N1) as well as VGA.
# The default entry boots by itself after 3 s, with the kernel console on
# both VGA (tty0) and COM1 (ttyS0). ttyS0 is listed last, so it is
# /dev/console (init/rcS messages go there).
# floppy=thinkpad: ThinkPads invert the floppy disk-change line
# (Documentation/admin-guide/blockdev/floppy.rst). On other PCs the
# inverted sense can hide media changes: boot the "generic" label there.
SERIAL 0 9600
DEFAULT tc32
PROMPT 1
TIMEOUT 30
SAY tc32: boots in 3 s.  [Enter]=VGA+COM1 9600   vga=VGA only   generic=non-ThinkPad   tc32 <codes>=custom
LABEL tc32
  KERNEL vmlinuz
  APPEND initrd=core.xz floppy=thinkpad console=tty0 console=ttyS0,9600n8
LABEL vga
  KERNEL vmlinuz
  APPEND initrd=core.xz floppy=thinkpad console=tty0 quiet
LABEL generic
  KERNEL vmlinuz
  APPEND initrd=core.xz console=tty0 console=ttyS0,9600n8
