# tc32 boot menu (syslinux 4.07). SERIAL lets the prompt be driven from COM1
# too (used by the automated QEMU test harness); harmless on real hardware.
SERIAL 0 9600
DEFAULT tc32
PROMPT 1
TIMEOUT 50
SAY tc32: [Enter]=boot (VGA console)   serial=COM1 console   tc32 <codes>=custom
LABEL tc32
  KERNEL vmlinuz
  APPEND initrd=core.xz quiet
LABEL serial
  KERNEL vmlinuz
  APPEND initrd=core.xz console=tty0 console=ttyS0,9600
