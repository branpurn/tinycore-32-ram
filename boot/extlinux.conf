# tc32 on disk (extlinux 4.07), written by install-to-disk. Same console
# defaults as the floppy: boot: prompt mirrored on COM1 9600 8N1, kernel
# console on VGA + COM1, auto-boot after 3 s. Extensions/persistence come
# from @TCEDEV@ (tce=), swap partitions are auto-enabled by rcS.
# atkbd.xlate=2: decode the 755C keyboard (raw i8042 port that still sends
# set-1 codes) as translated; "generic" uses the auto default.
SERIAL 0 9600
DEFAULT tc32
PROMPT 1
TIMEOUT 30
SAY tc32 (disk): boots in 3 s.  [Enter]=VGA+COM1 9600   vga=VGA only   generic=non-ThinkPad   notce=skip @TCEDEV@
LABEL tc32
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 console=ttyS0,9600n8 tce=@TCEDEV@
LABEL vga
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 quiet tce=@TCEDEV@
LABEL generic
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/core.xz console=tty0 console=ttyS0,9600n8 tce=@TCEDEV@
LABEL notce
  KERNEL /boot/vmlinuz
  APPEND initrd=/boot/core.xz floppy=thinkpad atkbd.xlate=2 console=tty0 console=ttyS0,9600n8
